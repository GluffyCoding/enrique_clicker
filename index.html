<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John didlefiggler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="main-title">hi john!</h1>
    <p id="text-box">epc: 1</p>
    <p id="text-box2">eps: 0</p>
    <p id="text-box3">epspm: 0</p>
    
    <div class="button-container">
        <button id="upgrade" class="upgrade-btn">upgrade epc<br>$ 100</button>
        <button id="upgrade2" class="upgrade-btn">upgrade eps<br>$ 50</button>
        <button id="upgrade3" class="upgrade-btn">upgrade epspm<br>$ 1000</button>
    </div>

    <img id="main" class="clickable-image" src="https://cdn3.emoji.gg/emojis/861909-michael.png" alt="Clicker Target" draggable="false">

    <button id="mute">unmute music</button>
    <button id="songchange">jazz - change song</button>

    <button id="toggleMenuBtn">Show Save Menu</button>

    <div id="save-menu-container" class="hidden">
        <h3>Save / Load Game Code</h3>
        <input type="text" id="saveCodeInput" placeholder="Paste save code here..."><br><br>
        <button id="generateSaveBtn">Get Save Code</button>
        <button id="loadSaveBtn">Load Code</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
